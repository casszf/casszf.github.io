<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ORBITE BAGELS AT HOME!</title>

  <link rel="preload" as="font" href="/ArchiveGaramondStd-Italic.woff2" type="font/woff2" crossorigin>

  <style>
    @font-face{
      font-family:"ArchiveGaramond";
      src:url("/ArchiveGaramondStd-Italic.woff2?v=2") format("woff2");
      font-weight:400; font-style:italic; font-display:swap;
    }
    :root{ --bg:#fafafa; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --ring:#e5e7eb; --brand:#111827; }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"ArchiveGaramond",serif;
      font-style:italic;
      background:var(--bg);
      color:var(--ink);
      font-size:18px;
      line-height:1.5;
    }
    .container{max-width:900px; margin:24px auto; padding:0 16px 64px}
    h1{font-size:32px; margin:0 0 6px}
    h2{font-size:20px; margin:20px 0 8px}
    p{margin:6px 0}
    .card{
      background:var(--card);
      border:1px solid var(--ring);
      border-radius:14px;
      padding:16px;
      box-shadow:0 1px 2px rgba(0,0,0,.05);
      margin-top:12px
    }

    .row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      align-items:center;
      padding:10px 0;
      border-bottom:1px dashed #e5e7eb
    }
    .row:last-child{border-bottom:none}
    .name{font-weight:600}
    .meta{font-size:14px; color:var(--muted)}
    .muted{color:var(--muted); font-size:14px}
    .qty{
      width:64px;
      padding:8px;
      border:1px solid var(--ring);
      border-radius:10px;
      background:#fff;
      font-size:16px;
      text-align:center
    }

    .grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}
    .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px}

    input[type="text"], input[type="tel"], textarea, select{
      width:100%;
      padding:10px 12px;
      border:1px solid var(--ring);
      border-radius:10px;
      font-size:16px;
      background:#fff
    }

    .total{
      font-size:20px;
      font-weight:700;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px;
      border:1px solid var(--ring);
      border-radius:12px;
      background:#fff
    }

    .btn{
      appearance:none;
      border:none;
      background:var(--brand);
      color:#fff;
      padding:12px 16px;
      border-radius:12px;
      font-size:16px;
      cursor:pointer
    }
    .btn:disabled{opacity:.5; cursor:not-allowed}

    .hidden{display:none !important}
    .row div:last-child { text-align:center; }
  </style>
</head>

<body>
  <div class="container">
    <h1>ORBITE BAGELS AT HOME!</h1>

    <!-- Coordonnées -->
    <div class="card">
      <div class="grid-3">
        <div>
          <label for="nom" class="name">nom</label>
          <input id="nom" name="nom" type="text" placeholder="Ton nom de famille" autocomplete="family-name" required />
        </div>
        <div>
          <label for="prenom" class="name">prénom</label>
          <input id="prenom" name="prenom" type="text" placeholder="Ton prénom" autocomplete="given-name" required />
        </div>
        <div>
          <label for="phone" class="name">téléphone</label>
          <input id="phone" name="phone" type="tel" placeholder="06 12 34 56 78" autocomplete="tel" required />
        </div>
      </div>
    </div>

    <!-- Bagels -->
    <h2>dis-nous ce que tu veux commander</h2>
    <p class="muted">nous recommandons 2 moitiés par personne 🍽️</p>
    <div class="card" id="bagels"></div>

    <!-- Mode (uniquement click & collect) -->
    <h2>dis-nous à quelle heure tu souhaites récupérer ta commande</h2>
    <div class="card">
      <p class="muted">retrait uniquement en click & collect.</p>

      <!-- Créneaux -->
      <div class="slots" id="slots">
        <p class="muted">choisis un créneau (obligatoire) :</p>
        <div class="grid-2">
          <div>
            <label class="name">Dimanche</label>
            <select id="slot-dimanche">
              <option value="">— choisir —</option>
